apiVersion: apps/v1 # Backend Deployment
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  # Uso del valore locale (replicaCount è al top level del values.yaml del Backend)
  # Usiamo il default per evitare errori se la sezione 'backend' nel values globale non ha 'replicaCount'
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
    spec:
      # L'Init Container si occupa di attendere il DB e di eseguire la migrazione dello schema.
      initContainers:
      - name: initsql
        # Immagine client MariaDB per eseguire lo script di migrazione
        image: {{ .Values.initDbImage | default "mariadb:10.6.12" }}
        imagePullPolicy: IfNotPresent
        
        securityContext:
          runAsUser: 0

        env:
        # Credenziali per accedere al DB (coerenti con il Secret)
        - name: DB_USER 
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_USER             
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_PASSWORD
        # MARIADB_HOST è richiesto dal client mariadb per la connessione
        - name: MARIADB_HOST 
          # Usiamo il nome del Service generato dal subchart DB
          value: {{ include "db.fullname" . }} 
        # DB_PORT (necessaria per lo script)
        - name: DB_PORT 
          # Accesso corretto al valore del Backend
          value: {{ .Values.dbPort | default 3306 | quote }}
        
        # Variabile per lo script
        - name: DB_NAME_FOR_SCRIPT
          # Accesso corretto al valore del Backend
          value: {{ .Values.dbName | default "san_martino_friendship_day" }}

        volumeMounts:
        - name: db-schema-migration
          mountPath: /schema 

        command: ["/bin/bash", "-c"]
        args:
          - |
            # Variabili locali per lo script
            DB_HOST={{ include "db.fullname" . }}
            DB_PORT=${DB_PORT}
            DB_NAME=${DB_NAME_FOR_SCRIPT}
            
            echo "1. Waiting for DB service $DB_HOST:$DB_PORT to be available..."
            # Attesa fino a quando il client mariadb riesce a connettersi usando le credenziali standard.
            until mariadb -h $DB_HOST -P $DB_PORT -u ${DB_USER} -p${DB_PASSWORD} -e "SELECT 1;" > /dev/null 2>&1; do
              echo "Database non ancora pronto, attesa 3 secondi..."
              sleep 3
            done
            echo "Database pronto e accessibile con le credenziali fornite."

            echo "2. Running schema migration (init.sql) on $DB_NAME..."
            # Esegue la migrazione. Se il comando fallisce (exit code != 0), il container fallisce.
            mariadb -h $DB_HOST -P $DB_PORT -u ${DB_USER} -p${DB_PASSWORD} $DB_NAME < /schema/init.sql
            
            if [ $? -ne 0 ]; then
                echo "ERRORE: La migrazione dello schema è fallita. Uscita con codice 1."
                exit 1
            fi
            
            echo "3. Verifying required tables (e.g., 'customers')..."
            # Verifica che la tabella "customers" esista dopo la migrazione.
            mariadb -h $DB_HOST -P $DB_PORT -u ${DB_USER} -p${DB_PASSWORD} $DB_NAME -e "SELECT 1 FROM customers;" > /dev/null 2>&1
            
            if [ $? -ne 0 ]; then
                echo "ERRORE: La tabella 'customers' non è stata trovata o non è accessibile. Uscita con codice 1."
                exit 1
            fi
            
            echo "DB schema loaded successfully. Init Container Complete."
            
      containers:
      - name: backend-container
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
          
        env: 
        # Variabili d'ambiente per il runtime del Backend
        - name: DB_HOST
          # Usiamo il nome del Service generato dal subchart DB
          value: "{{ include "db.fullname" . }}" 
        - name: DB_PORT
          # Accesso corretto al valore del Backend
          value: {{ .Values.dbPort | default 3306 | quote }}
        - name: DB_NAME
          # Accesso corretto al valore del Backend
          value: {{ .Values.dbName | default "san_martino_friendship_day" | quote }}
        - name: DB_USER 
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_USER             
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_PASSWORD
              
        # Liveness Probe (tempi aumentati)
        livenessProbe:
          httpGet:
            path: {{ .Values.healthPath | default "/health" }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 90 # Aumentato
          periodSeconds: 20       # Aumentato
          timeoutSeconds: 15
        
        # Readiness Probe (tempi aumentati)
        readinessProbe:
          httpGet:
            path: {{ .Values.healthPath | default "/health" }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 10 # Aumentato
          periodSeconds: 10       # Aumentato
          timeoutSeconds: 15

      # DEFINIZIONE DEI VOLUMI
      volumes:
      - name: db-schema-migration
        configMap:
          # Nomenclatura corretta per referenziare la ConfigMap del DB
          name: {{ include "db.fullname" . }}-schema-script