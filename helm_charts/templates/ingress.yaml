{{- if .Values.frontend.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "teletubbies-web-app.fullname" . }}-ingress
  labels:
    {{- include "teletubbies-web-app.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.frontend.ingress.className | quote }}
spec:
  rules:
  - host: {{ .Values.frontend.ingress.host | quote }}
    http:
      paths:
      # 1. Regola API: Traffico a /api va al Service del Backend
      - path: /api 
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.backend.fullnameOverride }} 
            port:
              number: {{ .Values.backend.service.port }}
      # 2. Regola di Default: Tutto il resto (/) va al Service del Frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.frontend.fullnameOverride }}
            port:
              number: {{ .Values.frontend.service.port }}
{{- end }}