#Backend Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
      - name: initsql
        image: {{ .Values.initDbImage }}
        imagePullPolicy: IfNotPresent
        
        securityContext:
          runAsUser: 0

        env:
        - name: DB_USER 
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_USER             
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_PASSWORD

        volumeMounts:
        - name: db-schema-migration
          mountPath: /schema 

        command: ["/bin/bash", "-c"]
        args:
          - |
            DB_HOST={{ .Values.db.host }}
            DB_NAME={{ .Values.db.name }}
            
            echo "1. Waiting for DB service $DB_HOST to be available..."
            until mariadb -h $DB_HOST -u ${DB_USER} -p${DB_PASSWORD} -e "SELECT 1;" > /dev/null 2>&1; do
              echo "Database non ancora pronto, attesa 3 secondi..."
              sleep 3
            done
            echo "Database pronto."

            echo "2. Running schema migration (init.sql) on $DB_NAME..."
            mariadb -h $DB_HOST -u ${DB_USER} -p${DB_PASSWORD} $DB_NAME < /schema/init.sql
            
            if [ $? -ne 0 ]; then
                echo "ERRORE: La migrazione dello schema è fallita."
                exit 1
            fi
            
            echo "3. Verifying required tables..."
            # Check che la tabella "customers" esista
            until mariadb -h $DB_HOST -u ${DB_USER} -p${DB_PASSWORD} $DB_NAME -e "SELECT 1 FROM customers;" > /dev/null 2>&1; do
              echo "Table 'customers' not loaded yet. Waiting 3 seconds..."
              sleep 3
            done
            
            echo "DB schema loaded successfully. Starting Backend."

      containers:
      - name: backend-container
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
          
        env: 
        - name: DB_HOST
          value: "{{ .Values.db.host }}"
        - name: DB_PORT
          value: {{ .Values.db.port | quote }}
        - name: DB_NAME
          value: {{ .Values.db.name | quote }}
        - name: DB_USER 
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_USER             
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_PASSWORD
              
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: 10
        
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          timeoutSeconds: 10

      # DEFINIZIONE DEI VOLUMI
      volumes:
      - name: db-schema-migration
        configMap:
          name: {{ include "db.fullname" $ }}-schema-script