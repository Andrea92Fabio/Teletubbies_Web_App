#Backend Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
      - name: wait-for-db
        image: {{ .Values.backend.initDbImage }}
        imagePullPolicy: IfNotPresent
        
        securityContext:
          runAsUser: 0

        command: ["/bin/bash", "-c"]
        args:
          - |
            DB_HOST={{ .Release.Name }}-db
            DB_NAME={{ .Values.backend.db.name }}
            
            echo "1. Waiting for DB service $DB_HOST to be available..."
            # Check connettività semplice
            until mariadb -h $DB_HOST -u ${DB_USER} -p${DB_PASSWORD} -e "SELECT 1;" > /dev/null 2>&1; do
              echo "Database non ancora pronto, attesa 3 secondi..."
              sleep 3
            done
            echo "Database pronto."

            echo "2. Running schema migration (init.sql) on $DB_NAME..."
            # Esegue lo script SQL montato dalla ConfigMap del DB
            mariadb -h $DB_HOST -u ${DB_USER} -p${DB_PASSWORD} < /schema/init.sql
            
            if [ $? -ne 0 ]; then
                echo "ERRORE: La migrazione dello schema è fallita."
                exit 1
            fi
            
            echo "3. Verifying required tables..."
            # Check che la tabella "customers" esista
            until mariadb -h $DB_HOST -u ${DB_USER} -p${DB_PASSWORD} $DB_NAME -e "SELECT 1 FROM customers;" > /dev/null 2>&1; do
              echo "Table 'customers' not loaded yet. Waiting 3 seconds..."
              sleep 3
            done
            
            echo "DB schema loaded successfully. Starting Backend."
        env:
        # Retrieve credentials from the Secret
        - name: DB_USER 
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_USER             
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_PASSWORD
        
        # MONTAGGIO DELLO SCHEMA DEL DB NEL BACKEND (CORRETTO)
        volumeMounts:
        - name: db-schema-migration # Nome del volume definito in 'volumes'
          mountPath: /schema       # Percorso di mount nel container

              
      # MAIN CONTAINER
      containers:
      - name: backend-container
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.backend.service.targetPort }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 12 }}
        env: 
        # Environment variables for application DB connection
        - name: DB_HOST
          value: "{{ .Release.Name }}-db"
        - name: DB_PORT
          value: {{ .Values.backend.db.port | quote }}
        - name: DB_NAME
          value: {{ .Values.backend.db.name | quote }}
        - name: DB_USER 
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_USER             
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_PASSWORD
              
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.backend.service.targetPort }}
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 10
        
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.backend.service.targetPort }}
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 10

      # DEFINIZIONE DEI VOLUMI
      volumes:
      - name: db-schema-migration
        configMap:
          # Questo definisce il contenuto del volume, puntando alla ConfigMap del DB
          name: {{ .Release.Name }}-db-schema-script
          items:
          - key: init.sql
            path: init.sql    
