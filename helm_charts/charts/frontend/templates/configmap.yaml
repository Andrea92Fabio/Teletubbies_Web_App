{{- if .Values.frontend.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  # Il contenuto del file /etc/nginx/conf.d/default.conf che sovrascriverà quello nell'immagine
  default.conf: |
    # Configurazione del Resolver DNS di Kubernetes (NECESSARIA)
    resolver 10.96.0.10 valid=5s;

    server {
        listen 80;
        server_name localhost;
        
        root /usr/share/nginx/html;
        index index.html;

        # Definisce la variabile contenente il nome completo e la porta del Service Backend
        set $backend_service "{{ include "backend.fullname" . }}:{{ .Values.ingress.backendServicePort }}";
        
        # Gestione delle rotte per applicazioni statiche/SPA
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Reverse proxy per il backend (VALORE DINAMICO PER KUBERNETES)
        location /api {
            proxy_pass http://$backend_service; 

            proxy_read_timeout 180s;
            proxy_connect_timeout 180s; 

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Cache per risorse statiche
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|pdf|webp)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
        
        # Compressione
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1000;
    }
{{- end -}}
