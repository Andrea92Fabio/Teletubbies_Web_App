apiVersion: apps/v1 # Frontend Deployment
kind: Deployment
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontend.selectorLabels" . | nindent 8 }}
    spec:
      # SA
      serviceAccountName: {{ .Values.global.serviceAccount.name }}

      containers:
      - name: frontend-container
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
        - name: BACKEND_SERVICE_HOST
          value: {{ include "backend.fullname" . | quote }}
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d/default.conf # Sovrascrive la config di default
          subPath: default.conf # Deve corrispondere al path creato dal volume
          readOnly: true

      volumes:  # <-- spostato qui, fuori dai containers
      - name: nginx-config-volume
        configMap:
          name: {{ include "frontend.fullname" . }}-nginx-conf
          items:
          - key: nginx.conf        # Chiave nel ConfigMap
            path: default.conf     # Nome del file nel container (corrisponde a subPath)
          defaultMode: 420         # Permessi 0644 sul file
