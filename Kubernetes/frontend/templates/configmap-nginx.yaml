apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-nginx-conf
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  nginx.conf: |
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api {
            # Puntamento dinamico tramite i values del microservizio
            set $backend_service_host_url "http://{{ .Values.backend.serviceName }}:{{ .Values.backend.servicePort }}";
            
            proxy_pass $backend_service_host_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~* \.(css|js|jpg|jpeg|png|gif|ico|pdf|webp)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }