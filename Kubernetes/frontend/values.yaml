# Values-Frontend
replicaCount: 1

image:
  repository: teletubbies-frontend
  tag: v1.0.0
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 80
  type: ClusterIP

# Configurazione del backend (che ora è un altro rilascio Helm separato)
backend:
  serviceName: teletubbies-app-backend
  servicePort: 8080

ingress:
  enabled: true
  className: "nginx"
  host: progetto.teletubbies.com
  # Porta usata dall'ingress per inoltrare al backend
  backendServicePort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "200m"
    memory: "512Mi"

global:
  serviceAccount:
    name: "teletubbies-eks-deployer"