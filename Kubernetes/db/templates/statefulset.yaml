{{- if .Values.db.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "db.fullname" . }}
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "db.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "db.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "db.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount.name }}
      containers:
      - name: db-container
        image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
        imagePullPolicy: {{ .Values.db.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.db.service.targetPort }}
        env:
        - name: MARIADB_DATABASE
          value: {{ .Values.db.databaseName | quote }}
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_USER
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_PASSWORD
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.secret.db.name }}
              key: DB_ROOT_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: schema-volume
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: schema-volume
        configMap:
          name: {{ include "db.fullname" . }}-schema-script
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ {{ .Values.db.pvc.accessModes | quote }} ]
      resources:
        requests:
          storage: {{ .Values.db.pvc.storage | quote }}
      {{- if .Values.db.pvc.storageClassName }}
      storageClassName: {{ .Values.db.pvc.storageClassName }}
      {{- end }}
{{- end }}