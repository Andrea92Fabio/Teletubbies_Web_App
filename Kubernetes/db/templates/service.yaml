apiVersion: v1
kind: Service
metadata:
  name: {{ include "db.fullname" . }}
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - protocol: TCP
      port: {{ .Values.db.service.port }}        
      targetPort: {{ .Values.db.service.targetPort }}  
  selector:
    {{- include "db.selectorLabels" . | nindent 4 }}
  type: {{ .Values.db.service.type }}