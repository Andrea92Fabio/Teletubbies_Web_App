steps:
- script: |
    set -x
    sudo apt-get update && sudo apt-get install -y docker-compose jq mysql-client
  displayName: 'Install dependencies'

- script: |
    set -x
    docker-compose down -v
    
    # Avvia docker-compose con timeout
    timeout 300 docker-compose up --build -d
    
    if [ $? -eq 124 ]; then
      echo "Timeout: docker-compose ha impiegato piu di 5 minuti"
      docker-compose logs
      exit 1
    fi
    
    docker-compose ps
  displayName: 'Start docker compose with timeout'

- script: |
    set -x
    echo "Waiting 20 seconds for services to fully initialize..."
    sleep 20
    echo "Starting availability tests..."
    echo "Waiting for frontend..."
    
    until curl -s -o /dev/null -w '%{http_code}' $(FRONTEND_URL_E2E) | grep -q '200'; do
      echo "$(date '+%Y-%m-%d %H:%M:%S') - Frontend not ready, retrying..."
      sleep 2
    done
    echo "Frontend is ready!"

    echo "Waiting for backend..."
    until curl -s -o /dev/null -w '%{http_code}' $(BACKEND_URL) | grep -q '200'; do
      echo "$(date '+%Y-%m-%d %H:%M:%S') - Backend not ready, retrying..."
      sleep 2
    done
    echo "Backend is ready!"
  displayName: 'Wait for services'
