steps:
# 1. Install Helm e Kubectl
- task: HelmInstaller@0
  displayName: 'Install Helm and Kubectl'
  inputs:
    helmVersion: 'latest' 
    installKubectl: true

# 2. Deploy on EKS (Script)
- script: |
    # Interrompe lo script al primo errore
    set -ex
    
    echo "Configuring AWS credentials for EKS cluster decyda-dev-eks..."
    aws eks update-kubeconfig --region $(ECR_REGION) --name decyda-dev-eks
    
    # 🚨 DEBUG: Stampa il Commit ID
    echo "Commit ID (Build.SourceVersion) is: $(Build.SourceVersion)"
    
    echo "Deploying to Namespace: dev using image tag $(Build.SourceVersion)"
    
    # Esegue l'upgrade del rilascio Helm
    helm upgrade --install teletubbies-app ./helm_charts \
      --namespace dev --create-namespace \
      -f ./helm_charts/values-eks-dev.yaml \
      --set backend.image.tag=$(Build.SourceVersion) \
      --set frontend.image.tag=$(Build.SourceVersion) \
      --set db.image.tag=$(Build.SourceVersion) \
      --wait --timeout 5m 
      
    echo "Deployment to DEV completed successfully!"
    
  displayName: 'Helm Deploy to decyda-dev-eks'
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_DEFAULT_REGION: $(ECR_REGION)

    
    # Esegue l'upgrade del rilascio Helm
    # - helm upgrade --install: installa se non esiste, altrimenti aggiorna
    # - teletubbies-app: nome del rilascio (release name)
    # - ./helm_charts: percorso al tuo umbrella chart
    # - -f values-eks-dev.yaml: usa le configurazioni DEV statiche
    # - --set ...: inietta dinamicamente il tag immagine generato dalla CI


