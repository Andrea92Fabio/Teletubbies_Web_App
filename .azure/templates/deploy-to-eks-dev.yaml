# 1. Definizione dei Parametri
parameters:
- name: environment
  type: string
  default: 'Development'
- name: namespace       
  type: string
- name: valuesFile
  type: string
- name: clusterName
  type: string

# 2. Steps del Deployment
steps:
# 1. Install Helm e Kubectl
- task: HelmInstaller@0
  displayName: 'Install Helm and Kubectl'
  inputs:
    helmVersion: 'latest' 
    installKubectl: true

# 2. Deploy on EKS (Script)
- script: |
    # Interrompe lo script al primo errore
    set -ex
    
    # Usa il parametro clusterName
    echo "Configuring AWS credentials for EKS cluster ${{ parameters.clusterName }}..."
    aws eks update-kubeconfig --region $(ECR_REGION) --name ${{ parameters.clusterName }}
    
    # DEBUG: Stampa il Commit ID
    echo "Commit ID (Build.SourceVersion) is: $(Build.SourceVersion)"
    
    # Usa il parametro namespace (ad esempio 'decyda-web-dev')
    echo "Deploying to Namespace: ${{ parameters.namespace }} using image tag $(Build.SourceVersion)"
    
    # Esegue l'upgrade del rilascio Helm
    helm upgrade --install teletubbies-web-app ./helm_charts \
      --namespace ${{ parameters.namespace }} --create-namespace \
      -f ./helm_charts/${{ parameters.valuesFile }} \
      --set backend.image.tag=$(Build.SourceVersion) \
      --set frontend.image.tag=$(Build.SourceVersion) \
      --set db.image.tag=$(Build.SourceVersion) \
      --wait --timeout 10m 
      
    echo "Deployment to ${{ parameters.environment }} completed successfully in namespace ${{ parameters.namespace }}!"
    
  displayName: 'Helm Deploy to ${{ parameters.clusterName }}'
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_DEFAULT_REGION: $(ECR_REGION)
