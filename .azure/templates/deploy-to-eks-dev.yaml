# 1. Definizione dei Parametri
parameters:
- name: environment
  type: string
  default: 'Development'
- name: namespace       
  type: string
- name: valuesFile
  type: string
- name: clusterName
  type: string

# 2. Steps del Deployment
steps:
# Install Helm e Kubectl
- task: HelmInstaller@0
  displayName: 'Install Helm and Kubectl'
  inputs:
    helmVersion: 'latest' 
    installKubectl: true

# Calcola l'SHA abbreviato
- script: |
    # Estrai i primi 7 caratteri dell'ID di commit e imposta una variabile di output
    COMMIT_SHA_SHORT=$(echo "$(Build.SourceVersion)" | cut -c1-7)
    echo "##vso[task.setvariable variable=CommitShortSha]$COMMIT_SHA_SHORT"
    echo "CommitShortSha calcolato: $COMMIT_SHA_SHORT"
  displayName: 'Calculate Short Commit SHA'  

# Deploy on EKS (Script)
- script: |
    # Interrompe lo script al primo errore
    set -ex
    
    # Usa il parametro clusterName
    echo "Configuring AWS credentials for EKS cluster ${{ parameters.clusterName }}..."
    aws eks update-kubeconfig --region $(ECR_REGION) --name ${{ parameters.clusterName }}
    
    # DEBUG: Stampa l'ID di Commit abbreviato
    echo "Commit ID (Short) is now: $(CommitShortSha)"
    
    # Usa il parametro namespace (ad esempio 'decyda-web-dev')
    echo "Deploying to Namespace: ${{ parameters.namespace }} using image tag $(CommitShortSha)"
    
    # Esegue l'upgrade del rilascio Helm
    helm upgrade --install teletubbies-web-app ./helm_charts \
      --namespace ${{ parameters.namespace }} --create-namespace \
      -f ./helm_charts/${{ parameters.valuesFile }} \
      --set backend.image.tag=$(CommitShortSha) \
      --set frontend.image.tag=$(CommitShortSha) \
      --set db.image.tag=$(CommitShortSha) \
      --wait --timeout 10m 
      
    echo "Deployment to ${{ parameters.environment }} completed successfully in namespace ${{ parameters.namespace }}!"
    
  displayName: 'Helm Deploy to ${{ parameters.clusterName }}'
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_DEFAULT_REGION: $(ECR_REGION)
