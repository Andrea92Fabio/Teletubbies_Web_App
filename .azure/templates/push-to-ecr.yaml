steps:
# Step 1: ECR Login
- script: |
    set -ex
    echo "Getting ECR login token for region $(ECR_REGION)..."
    aws ecr get-login-password --region $(ECR_REGION) | docker login --username AWS --password-stdin $(ECR_REGISTRY)
    echo "Successfully logged into ECR"

  displayName: 'ECR Login'
  
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_DEFAULT_REGION: $(ECR_REGION)

# Step 2: Ottieni versione da Git e Docker Tag
- script: |
    set -x
    echo "Getting Git version for tagging..."
    
    # Ottieni il tag git o l'hash del commit
    GIT_VERSION=$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short HEAD)
    echo "Using Git version: $GIT_VERSION"

    # Esportiamo la versione come variabile di pipeline/ambiente
    echo "##vso[task.setvariable variable=GIT_VERSION]$GIT_VERSION"
    
    echo "Tagging teletubbies images for ECR with version: $GIT_VERSION"
    
    # Tag backend con versione
    docker tag $(docker-compose images -q backend) $(ECR_REGISTRY)/teletubbies-backend:$GIT_VERSION
    docker tag $(docker-compose images -q backend) $(ECR_REGISTRY)/teletubbies-backend:latest
    
    # Tag frontend con versione
    docker tag $(docker-compose images -q frontend) $(ECR_REGISTRY)/teletubbies-frontend:$GIT_VERSION
    docker tag $(docker-compose images -q frontend) $(ECR_REGISTRY)/teletubbies-frontend:latest
    
    # Tag database con versione
    docker tag $(docker-compose images -q db) $(ECR_REGISTRY)/teletubbies-db:$GIT_VERSION
    docker tag $(docker-compose images -q db) $(ECR_REGISTRY)/teletubbies-db:latest
    
    echo "All images tagged successfully"
  displayName: 'Docker Tag Teletubbies Images with Git Version'

# Step 3: Docker Push per tutte e tre le immagini
- script: |
    set -ex # Aggiunto 'e' per garantire l'uscita in caso di fallimento del push
    echo "Pushing teletubbies images to ECR..."
    
    # Non ricalcolare GIT_VERSION. Usa la variabile di pipeline $(GIT_VERSION)
    # impostata nello Step 2 (richiamabile con la sintassi Azure DevOps).
    
    # Push backend
    echo "Pushing teletubbies-backend:$(GIT_VERSION) and :latest"
    docker push $(ECR_REGISTRY)/teletubbies-backend:$(GIT_VERSION)
    docker push $(ECR_REGISTRY)/teletubbies-backend:latest
    
    # Push frontend
    echo "Pushing teletubbies-frontend:$(GIT_VERSION) and :latest"
    docker push $(ECR_REGISTRY)/teletubbies-frontend:$(GIT_VERSION)
    docker push $(ECR_REGISTRY)/teletubbies-frontend:latest
    
    # Push db
    echo "Pushing teletubbies-db:$(GIT_VERSION) and :latest"
    docker push $(ECR_REGISTRY)/teletubbies-db:$(GIT_VERSION)
    docker push $(ECR_REGISTRY)/teletubbies-db:latest
    
    echo "All teletubbies images successfully pushed to ECR with version: $(GIT_VERSION)"
  displayName: 'Docker Push Teletubbies to ECR'
