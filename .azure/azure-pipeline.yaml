trigger:
  branches:
    include:
      - main
      - 'feature/*'
  
  # Tag triggers
  tags:
    include:
      - '*'

variables:
  # Variabili in linea definite come elementi di una lista
  - name: system.debug
    value: true
  
  # URLs (omesse per brevità)
  - name: FRONTEND_URL_API
    value: 'http://localhost:8081/api/submission'
  - name: FRONTEND_URL_E2E
    value: 'http://localhost:8081'
  - name: BACKEND_URL_API
    value: 'http://localhost:8080/api/submission'
  - name: BACKEND_URL
    value: 'http://localhost:8080/health'
  
  # Variabile TEST_DATA (omessa per brevità)
  - name: TEST_DATA
    value: |
      {"name":"Andrea",
      "surname":"Grossi",
      "gender":"man",
      "email":"xhunterx92@gmail.com",
      "residencyCountry":"italy",
      "fiscalCode":"GRSNRF92L31F205T",
      "residencyZipCode":"20031",
      "residencyAddress":"Via Enrico Berlinguer, 11",
      "shipCountry":"italy",
      "shipZipCode":"20031",
      "shipAddress":"Via Enrico Berlinguer, 11",
      "privacy":true,
      "rules":true,"birthDate":"1992-07-31",
      "phoneNumber":"3408461295",
      "residencyProvince":"MI",
      "shipProvince":"MI"}

  # Variabili ECR (omesse per brevità)
  - name: ECR_REGISTRY
    value: '089648475292.dkr.ecr.eu-south-1.amazonaws.com'
  - name: ECR_REGION
    value: 'eu-south-1'
  
  # Riferimento al gruppo di variabili AWS
  - group: aws-credentials

  # Questa variabile è stata mantenuta solo per riferimento, ma non viene usata nella condizione finale.
  - name: IS_MAIN_OR_TAG
    value: $[or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))]
    
  # Questa variabile è stata mantenuta solo per riferimento, ma non viene usata nella condizione finale.
  - name: IS_ANY_BRANCH
    value: $[not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))]


jobs:
- job: Pipeline
  displayName: 'End-to-end Pipeline'
  pool:
    vmImage: 'ubuntu-latest'
  steps: 
    # Setup servizi Docker (Necessario per le immagini di build, lo lasciamo)
    - template: templates/setup-services.yaml
    
    # Esegui tutti i test
    # - template: templates/run-tests.yaml 
    
    # Push immagini su ECR (Eseguito su tutti i branch: main e feature/*)
    - ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
      - template: templates/push-to-ecr.yaml 

    # Deploy DEV Environment (Commit ID)
    # Eseguito su tutti i branch (main e feature/*) e indirizzato al namespace 'dev'
    - ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
      - script: |
          echo "Starting Dev Deploy to decyda-web-dev using image tag $(Build.SourceVersion)"
        displayName: 'Init Dev Deploy'
      
      - template: templates/deploy-to-eks-dev.yaml
        parameters:
          environment: 'Development'
          namespace: 'decyda-web-dev'
          valuesFile: 'values-eks-dev.yaml'
          clusterName: 'decyda-dev-eks'

    # Pulizia finale
    - script: docker-compose down -v
      displayName: 'Stop docker compose'